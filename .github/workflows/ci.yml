name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run: catches dependency/environment drift even in weeks when
  # no code lands on main.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.14 matches the Streamlit Cloud runtime the app deploys on;
          # requirements.txt pins require 3.12+.
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        # ruff.toml pins the rule set, so this resolves the same rules a
        # local `ruff check app src` does.
        run: ruff check app src
      - name: Compile Python
        run: python -m compileall -q app src
      - name: Run tests
        # pytest.ini's testpaths make this the whole offline suite:
        # synthetic Cricsheet-fixture collector tests + the AppTest
        # render tests. Nothing here touches the network.
        run: >-
          python -m pytest -q
          --cov=app --cov=src
          --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 30
